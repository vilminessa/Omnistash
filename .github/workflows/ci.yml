# Проверки на каждый push/PR: офлайн-тесты, синтаксис, сборка превью.
# Живые тесты (OMNISTASH_LIVE=1) в CI не гоняются: там реальная загрузка
# с YouTube, а CI обязан быть детерминированным.

name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

# Раннер Windows отдаёт cp1252, а сообщения проекта русские: без UTF-8
# падает даже print() в линте.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

permissions:
  contents: read

jobs:
  checks:
    name: офлайн-проверки
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Зависимости
        run: python -m pip install -r requirements.txt
      - name: Линт workflows (пины SHA, permissions)
        run: python tools/check_workflows.py
      - name: Синтаксис Python
        run: python -m compileall -q app omnistash.py version.py tests tools
      - name: Синтаксис JS
        shell: bash
        run: node --check ui_src/app.js
      - name: Превью интерфейса собирается
        run: python tools/build_preview.py
      - name: Офлайн-тесты
        # Модули независимы (каждый берёт свой профиль во временную папку),
        # поэтому гоняются параллельно по ядрам раннера: то же покрытие
        # проверок и заметно быстрее последовательного discover.
        run: python tools/run_tests.py
      # Бандл клиента (S7): собирается после набора проверок, потому что
      # проверяется тем же кодом, что раздаёт слушатель (--serve). Линт пинов
      # - сверка sha256 вендора с метадатой; несоответствие называет причину,
      # а не «тихо скопировали что есть».
      - name: Пины клиентского вендора сверяются
        run: python tools/build_client.py --check
      - name: Клиентский бандл собирается
        run: python tools/build_client.py --zip
      # Юр-пак (docs/LEGAL-REVIEW.md §5.2): тексты, которые условие «Notices»
      # требует передать рядом с exe. Сверка идёт после набора тестов: состав
      # пакета читается из репозитория, LICENSE сверяется с каноническим
      # текстом по sha256, notifications покрывают состав exe и прямые
      # зависимости. Отсутствие файла или непокрытый компонент - отказ с
      # причиной, молчания нет.
      - name: Юр-пак сверяется с текстами условий
        run: python tools/build_legal_pack.py --check
      - name: Юр-пак собирается
        run: python tools/build_legal_pack.py --zip
