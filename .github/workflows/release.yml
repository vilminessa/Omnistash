# Релизы по тегам: проверки -> сборка exe -> публикация в релиз -> SLSA-провенанс.
# Пробный запуск: workflow_dispatch (ветка вручную) - пройдут verify и build,
# публикация и провенанс выполняются только на тегах v*.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Раннер Windows отдаёт cp1252, а сообщения проекта русские: без UTF-8
# падает даже print() в линте.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

permissions:
  contents: read

jobs:
  verify:
    name: проверки перед сборкой
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Зависимости
        run: python -m pip install -r requirements.txt
      - name: Линт workflows (пины SHA, permissions)
        run: python tools/check_workflows.py
      - name: Офлайн-тесты
        # Модули независимы (каждый берёт свой профиль во временную папку):
        # параллельный прогон по ядрам раннера, покрытие то же.
        run: python tools/run_tests.py
      - name: Версия совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          ver=$(python -c "import version; print(version.__version__)")
          echo "version.py=$ver tag=$GITHUB_REF_NAME"
          test "$ver" = "${GITHUB_REF_NAME#v}"
      - name: Синтаксис JS
        shell: bash
        run: node --check ui_src/app.js
      - name: Превью интерфейса собирается
        run: python tools/build_preview.py
      # Бандл клиента (S7) проверяется до сборки exe: пин вендора и отсутствие
      # чужих адресов в рантайме - те же проверки, что исполняет --serve.
      - name: Пины клиентского вендора сверяются
        run: python tools/build_client.py --check
      - name: Клиентский бандл собирается (проба)
        run: python tools/build_client.py
      # Юр-пак (docs/LEGAL-REVIEW.md §5.2): тексты условий и уведомлений,
      # которые обязан получить каждый, кто скачал exe. Сверка до сборки exe.
      - name: Юр-пак сверяется с текстами условий
        run: python tools/build_legal_pack.py --check
      - name: Юр-пак собирается (проба)
        run: python tools/build_legal_pack.py

  build:
    name: сборка Omnistash.exe
    needs: verify
    runs-on: windows-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Зависимости
        run: python -m pip install -r requirements.txt
      - name: Сборка exe (onefile, версия из version.py в ресурсах)
        run: python -m PyInstaller Omnistash.spec --distpath . --workpath build --noconfirm
      - name: Проверка артефакта
        shell: bash
        # нижняя граница - защита от пустой/обрезанной сборки: собранный
        # локально Omnistash.exe весит ~30.4 МБ (2026-11-05: три сборки
        # одного дерева дали 30 432 624, 30 433 270 и 30 433 590 байт -
        # закрепляется нижняя граница, а не размер)
        run: python -c "import os; s = os.path.getsize('Omnistash.exe'); print('Omnistash.exe', s, 'bytes'); assert s > 20_000_000, s"
      # Состав exe (docs/LEGAL-REVIEW.md §5.2): сверка по TOC после размера
      # и до хеша артефакта - чужой бинарь или потерянный текст лицензии
      # видны до публикации ассетов и до SLSA-подписи.
      - name: Сверка состава exe по TOC
        run: python tools/check_exe_contents.py
      - name: Хеш артефакта (формат sha256sum, base64 - для SLSA)
        id: hash
        shell: bash
        run: |
          python -c "import hashlib, base64; h = hashlib.sha256(); f = open('Omnistash.exe', 'rb'); [h.update(c) for c in iter(lambda: f.read(1048576), b'')]; open('digests.b64', 'w').write(base64.b64encode((h.hexdigest() + '  Omnistash.exe\n').encode()).decode())"
          echo "digests=$(cat digests.b64)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Omnistash-exe
          path: Omnistash.exe
          if-no-files-found: error
          retention-days: 5
      # Клиентский бандл (S7): страницы, CSS/JS плеера и вендор с пином -
      # тот же состав, что раздаёт --serve. Отдельный ассет: SLSA-подпись
      # считается по exe, бандл публикуется как файл релиза без провенанса.
      - name: Сборка клиентского бандла
        run: python tools/build_client.py --zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Omnistash-client
          path: client_dist/omnistash-client.zip
          if-no-files-found: error
          retention-days: 5
      # Юр-пак: LICENSE с Required Notice, уведомления о сторонах, правила
      # использования, FAQ и текст лицензии вендора. Условие «Notices» из
      # PolyForm Noncommercial требует, чтобы получатель копии получил их
      # вместе с exe - поэтому пакет публикуется отдельным ассетом релиза.
      # SLSA-подпись считается по exe, на пакет она не распространяется.
      - name: Сборка юр-пакета
        run: python tools/build_legal_pack.py --zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Omnistash-notices
          path: release_pack/omnistash-notices.zip
          if-no-files-found: error
          retention-days: 5

  python-publish:
    name: публикация exe в релиз
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Omnistash-exe
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Omnistash-client
          path: client
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Omnistash-notices
          path: notices
      - name: Создать/обновить релиз тега
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Автоматическая сборка (CI). Провенанс SLSA прикладывается отдельным джобом (по exe). Клиентский бандл - тот же состав, что раздаёт --serve; на бандл провенанс не распространяется. Юр-пак (LICENSE с Required Notice, THIRD_PARTY_NOTICES.md, ACCEPTABLE_USE.md, LEGAL_FAQ.md и текст лицензии hls.js) уезжает рядом с exe: так выполняется условие «Notices» PolyForm Noncommercial; на него провенанс тоже не распространяется."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Omnistash.exe client/omnistash-client.zip notices/omnistash-notices.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" Omnistash.exe client/omnistash-client.zip notices/omnistash-notices.zip --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes"
          fi

  generator-generic-ossf-slsa3-publish:
    name: SLSA-провенанс
    needs: [build, python-publish]
    # на теге ждём успеха публикации, на dispatch публикация пропущена -
    # генерация провенанса всё равно должна пройти (проба конвейера);
    # если сама сборка упала - провенансу обсуждать нечего
    if: always() && needs.build.result == 'success' && (needs.python-publish.result == 'success' || needs.python-publish.result == 'skipped')
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      # на теге - в релиз, на dispatch - просто артефакт рана (проба конвейера)
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}

  verify-attestation:
    name: проверка подписи
    needs: generator-generic-ossf-slsa3-publish
    # интота-бандл подписывается в ассеты релиза (upload-assets) - на теге
    # сверяем его с exe; на dispatch ассетов релиза нет - пропускаем
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Скачать exe и провенанс из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            -p Omnistash.exe -p Omnistash.exe.intoto.jsonl --clobber
      - name: Юр-пак скачивается из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        # условие «Notices» сверяется по факту: ассет пакета должен лежать в
        # релизе рядом с exe, иначе скачавший бинарник текстов условий не получил.
        # Граница снизу - защита от пустого или обрезанного ассета.
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            -p omnistash-notices.zip --clobber
          python3 -c "import os; s = os.path.getsize('omnistash-notices.zip'); print('omnistash-notices.zip', s, 'bytes'); assert s > 25_000, s"
      - name: gh attestation verify (bundle из релиза)
        env:
          GH_TOKEN: ${{ github.token }}
        # бандл - sigstore + provenance v0.2, подписант - reusable workflow
        # генератора: без этих флагов gh ищет v1 в реестре и даёт 404
        run: |
          gh attestation verify Omnistash.exe \
            --bundle Omnistash.exe.intoto.jsonl \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v0.2 \
            --signer-repo slsa-framework/slsa-github-generator
